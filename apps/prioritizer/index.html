<!doctype html>
<html lang="en" data-theme="light" data-app="prioritizer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Only this site, plus Workshop on this computer (127.0.0.1) once paired -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*; frame-src 'self' http://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Docket</title>
<meta name="theme-color" content="#F4F2F3">
<!-- sets the theme before first paint so there's no flash -->
<script src="../../shared/theme.js"></script>
<script src="../../shared/vendor/xlsx.full.min.js" defer></script>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../../icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../../icons/app-touch-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Docket">
<link rel="stylesheet" href="../../shared/themes.css">
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Sidebar">
    <div class="sbrand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 26 26"><path fill="currentColor" d="M5 3h16a3 3 0 0 1 3 3v4.2a2.8 2.8 0 0 0 0 5.6V20a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-4.2a2.8 2.8 0 0 0 0-5.6V6a3 3 0 0 1 3-3Z"/><path d="M8 9.5h10M8 13h10M8 16.5h6" fill="none" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round"/></svg></span><b>Docket</b>
    </div>
    <nav class="snav" id="snav" aria-label="Views"></nav>
    <div class="sfoot">
      <button class="ibtn collapse-btn" id="collapseBtn" aria-label="Collapse sidebar" data-tip="Collapse sidebar">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M8 4v12"/></svg>
      </button>
      <button class="ibtn" id="syncBtn" aria-label="Files and saving" data-sync="saving">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M2.75 6.25a1.5 1.5 0 0 1 1.5-1.5h3.4l1.6 1.75h6.5a1.5 1.5 0 0 1 1.5 1.5v6.75a1.5 1.5 0 0 1-1.5 1.5H4.25a1.5 1.5 0 0 1-1.5-1.5z"/><path class="mk-ok" d="M7.25 11.25l2 2 3.5-3.75"/><path class="mk-x" d="M8.25 9.5l3.5 3.5M11.75 9.5l-3.5 3.5"/></svg>
      </button>
      <button class="ibtn" id="adoBtn" aria-label="Azure DevOps sync" data-ado="off">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 9.5A6 6 0 0 0 5.2 6.2M4 10.5a6 6 0 0 0 10.8 3.3"/><path d="M16.3 4.8v4.7h-4.6M3.7 15.2v-4.7h4.6"/><path class="mk-x" d="M8.6 8.6l2.8 2.8M11.4 8.6l-2.8 2.8"/></svg>
      </button>
      <span class="grow"></span>
      <button class="ibtn setbtn" id="setBtn" aria-label="Settings" aria-haspopup="menu" data-tip="Settings: day and sprint, row fields, Azure DevOps, files">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/><circle cx="7" cy="6" r="1.6" fill="var(--bg)"/><circle cx="13" cy="10" r="1.6" fill="var(--bg)"/><circle cx="9" cy="14" r="1.6" fill="var(--bg)"/></svg><span class="lbl">Settings</span>
      </button>
      <input type="file" id="importFile" accept=".xlsx,.xls,.csv,.json" hidden>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="page">
    <div class="nowbar" id="nowbar" role="region" aria-label="Focus" hidden></div>
    <header class="phead" id="phead"></header>
    <main id="main"></main>
  </div>
  <div class="dscrim" id="dscrim"></div>
  <aside class="drawer" id="drawer" aria-label="Task details"></aside>
</div>
<div class="cmd" id="cmd">
  <div class="backdrop" data-cmd-close></div>
  <div class="box" role="dialog" aria-modal="true" aria-label="Add a task">
    <div class="inrow">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      <input id="cmdInput" placeholder="Add a task" aria-label="New task" autocomplete="off" enterkeyhint="done">
      <button class="btn ghost" data-cmd-close>Done</button>
    </div>
    <div class="parsed" id="cmdParsed" aria-live="polite"></div>
    <div class="cheat" id="cmdCheat" hidden></div>
    <div class="help"><button type="button" class="cheat-btn" id="cmdCheatBtn" aria-expanded="false" aria-controls="cmdCheat"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4l2.5 2.5L7.5 4"/></svg>Cheat sheet</button><span class="kb-only" id="cmdCheatKey"><kbd>Ctrl /</kbd> toggle</span><span class="kb-only"><kbd>Enter</kbd> add</span><span class="kb-only"><kbd>Esc</kbd> close</span></div>
  </div>
</div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip"></div>

<!-- Shared with the shell: the theme helper (in <head>) and the service worker registration. These
     stay classic scripts, so WorkshopTheme and WorkshopSw are on window for the app modules to use. -->
<script src="../../shared/sw-register.js"></script>
<!-- Prioritizer is one ES module graph now. main.js imports the rest, and reaches the shell, data
     and connectors through the SDK (../../shared/workshop-sdk.js). -->
<script type="module" src="js/main.js"></script>
</body>
</html>
