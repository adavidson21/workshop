<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Nothing leaves this device but calls to Workshop on 127.0.0.1. Images come from your Workshop folder as blob: URLs; remote images are never loaded. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob:; connect-src 'self' http://127.0.0.1:*; frame-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Notes</title>
<meta name="description" content="Markdown notes in your Workshop folder: folders, links and backlinks, tags, search and images.">
<meta name="theme-color" content="#F4F1EA">
<script src="../../shared/theme.js"></script>
<script src="../../shared/sw-register.js"></script>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="stylesheet" href="../../shared/fonts/fonts.css">
<link rel="icon" type="image/svg+xml" href="../../icons/favicon.svg">
<link rel="apple-touch-icon" href="../../icons/app-touch-180.png">
<link rel="stylesheet" href="../../shared/themes.css">
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="stylesheet" href="notes.css">
</head>
<body>
<div class="notes">
  <aside id="side" class="side" aria-label="Notes"></aside>
  <main id="main" class="main">
    <div id="head"></div>
    <div id="body" class="body mode-split" hidden>
      <label class="sr" for="editor">Note text (Markdown)</label>
      <textarea id="editor" class="editor" spellcheck="true" autocomplete="off" autocapitalize="sentences"></textarea>
      <article id="preview" class="md" aria-label="Preview"></article>
      <div id="picker" class="picker" hidden></div>
    </div>
    <div id="empty"></div>
  </main>
  <aside id="panel" class="panel" aria-label="About this note" hidden></aside>
</div>
<dialog id="dlg" aria-label="Notes"></dialog>
<script type="module" src="js/main.js"></script>
</body>
</html>
