<head>

<meta name="referrer" content="no-referrer">
<title>Slate</title>
<meta name="description" content="Your ADO backlog from request to who builds it: triage, define, publish, then delegate or build it yourself, with Tandem doing the legwork.">
<meta name="theme-color" content="#F4F2F3">
<script src="../../shared/theme.js"></script>
<script src="../../shared/sw-register.js"></script>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="stylesheet" href="../../shared/fonts/fonts.css">
<link rel="icon" type="image/svg+xml" href="../../icons/favicon.svg">
<link rel="apple-touch-icon" href="../../icons/app-touch-180.png">
<link rel="stylesheet" href="../../shared/themes.css">
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="stylesheet" href="slate.css">
</head>
<body>
<div class="slate">
  <header id="top"></header>
  <div class="work">
    <main id="main" class="main"><p class="loading">Loading…</p></main>
    <aside id="panel" class="panel" aria-label="Item" hidden></aside>

</div>
