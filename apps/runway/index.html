<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Only this site, plus Workshop on this computer (127.0.0.1) when you connect it. Exports are made in the page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:*; frame-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Runway</title>
<meta name="description" content="Team and project roadmaps: type an outline, drag the timeline, export an image or Markdown.">
<meta name="theme-color" content="#F4F1EA">
<!-- sets the theme before first paint so there's no flash -->
<script src="../../shared/theme.js"></script>
<link rel="stylesheet" href="../../shared/fonts/fonts.css">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../../icons/app-touch-180.png">
<meta name="apple-mobile-web-app-title" content="Runway">
<link rel="stylesheet" href="../../shared/themes.css">
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"><p class="loading">Loading Runway.</p></div>
<dialog id="dlg" aria-label="Dialog"></dialog>
<!-- Shared with Workshop: the theme helper (in <head>) and the service worker registration stay classic
     scripts, so WorkshopTheme and WorkshopSw are on window. Runway itself is one ES module graph. -->
<script src="../../shared/sw-register.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
