name: checks
# Pull requests, and pushes to main (the merge). Pushes to a PR branch are covered by pull_request, so a PR
# runs CI once, not twice.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: node tests/check-themes.mjs
      - run: node tests/check-offline.mjs
      - run: node tests/check-contracts.mjs
      - run: node shell/registry.mjs --check
      - run: node --test "shared/test/*.test.mjs"
      - run: node --test "apps/*/test/*.test.mjs"
      - run: node --test "tests/contract/*.test.mjs"
      - run: node --test "connectors/*/test/*.test.mjs"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/e2e.py
      # Tests must use temp folders only. A fresh runner has neither folder, so finding one means a test wrote there.
      - name: No test touched the real data folder or Workshop home
        if: ${{ !cancelled() }}
        run: |
          node -e "const fs=require('fs'),p=require('path'),h=require('os').homedir();const found=['Workshop','.workshop'].map(n=>p.join(h,n)).filter(d=>fs.existsSync(d));if(found.length){console.error('Created by a test: '+found.join(', '));process.exit(1)}"
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF line endings on Windows: the contract tests read docs/*.md with \n-based patterns.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Agent tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./agent/test/github-reporter.mjs --test-reporter-destination=stdout "agent/test/*.test.mjs"
      - name: Contract suite against the real agent
        if: ${{ !cancelled() }}
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./agent/test/github-reporter.mjs --test-reporter-destination=stdout "tests/contract/*.test.mjs"
        env:
          WORKSHOP_TARGET: agent/test-target.mjs
      - name: Connector tests
        if: ${{ !cancelled() }}
        run: node --test "connectors/*/test/*.test.mjs"
      # Tests must use temp folders only. A fresh runner has neither folder, so finding one means a test wrote there.
      - name: No test touched the real data folder or Workshop home
        if: ${{ !cancelled() }}
        run: |
          node -e "const fs=require('fs'),p=require('path'),h=require('os').homedir();const found=['Workshop','.workshop'].map(n=>p.join(h,n)).filter(d=>fs.existsSync(d));if(found.length){console.error('Created by a test: '+found.join(', '));process.exit(1)}"
