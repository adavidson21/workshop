name: checks
# Pull requests, and pushes to main (the merge). Pushes to a PR branch are covered by pull_request, so a PR
# runs CI once, not twice.
on:
  pull_request:
  push:
    branches: [main]
# A newer push to the same pull request cancels the run still going. Pushes to main always finish (Release needs them).
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node tests/check-themes.mjs
      - run: node tests/check-vendor.mjs
      - run: node tests/check-offline.mjs
      - run: node tests/check-site.mjs
      - name: Boundaries between apps, shell, shared files, agent and connectors (docs/shared.md)
        run: node tests/check-boundaries.mjs
      - run: node tests/check-contracts.mjs
      - run: node shell/registry.mjs --check
      - run: node --test "shared/test/*.test.mjs"
      - run: node --test "apps/*/test/*.test.mjs"
      - run: node --test "worker/test/*.test.mjs"
      - run: node --test "tests/contract/*.test.mjs"
      - run: node --test "connectors/*/test/*.test.mjs"
      - name: Every app can be pulled out (docs/shared.md, B8)
        run: node tests/check-extract.mjs
  # The browser tests, split into runs of about the same length that go side by side. e2e.py's two halves: E2E_PART.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hub
            run: E2E_PART=hub python tests/e2e.py
          - name: agent
            run: E2E_PART=agent python tests/e2e.py
          - name: layout, review, work mode
            run: |
              python tests/layout-e2e.py
              python tests/review-e2e.py
              python tests/workmode-e2e.py
          - name: Runway and Folio on their own pages
            run: |
              python apps/runway/test/e2e.py
              python apps/runway/test/e2e_ado.py
              python apps/notes/test/e2e.py
          - name: Docket on its own page
            run: |
              python apps/prioritizer/test/e2e.py
              python apps/prioritizer/test/focus-e2e.py
          - name: focus, popout, switches
            run: |
              python tests/focus-e2e.py
              python tests/transitions-e2e.py
              python tests/popout-e2e.py
              python tests/switches-e2e.py
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: 'true' }
      - run: ${{ matrix.run }}
      - name: Layout screenshots
        if: ${{ !cancelled() && startsWith(matrix.name, 'layout') }}
        uses: actions/upload-artifact@v4
        with: { name: layout-screenshots, path: tests/out/layout/, if-no-files-found: ignore }
      # Tests must use temp folders only. A fresh runner has neither folder, so finding one means a test wrote there.
      - name: No test touched the real data folder or Workshop home
        if: ${{ !cancelled() }}
        run: |
          node -e "const fs=require('fs'),p=require('path'),h=require('os').homedir();const found=['Workshop','.workshop'].map(n=>p.join(h,n)).filter(d=>fs.existsSync(d));if(found.length){console.error('Created by a test: '+found.join(', '));process.exit(1)}"
  # One result for unit and e2e under the old job name, so a required "checks" status keeps working.
  checks:
    if: ${{ always() }}
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "unit: ${{ needs.unit.result }}, e2e: ${{ needs.e2e.result }}"
          [ "${{ needs.unit.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ]
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF line endings on Windows: the contract tests read docs/*.md with \n-based patterns.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The one-line installer runs in Windows PowerShell 5.1 (irm ... | iex), so parse it with that.
      - name: Installer scripts parse in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in @('scripts\bootstrap.ps1', 'scripts\install.ps1')) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "${f}:$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 } else { Write-Host 'Installer scripts parse.' }
      - name: Installer script parses in bash
        if: runner.os != 'Windows'
        run: bash -n scripts/bootstrap.sh && bash -n scripts/install.sh
      - name: Agent tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./agent/test/github-reporter.mjs --test-reporter-destination=stdout "agent/test/*.test.mjs"
      - name: Contract suite against the real agent
        if: ${{ !cancelled() }}
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./agent/test/github-reporter.mjs --test-reporter-destination=stdout "tests/contract/*.test.mjs"
        env:
          WORKSHOP_TARGET: agent/test-target.mjs
      - name: Connector tests
        if: ${{ !cancelled() }}
        run: node --test "connectors/*/test/*.test.mjs"
      # Tests must use temp folders only. A fresh runner has neither folder, so finding one means a test wrote there.
      - name: No test touched the real data folder or Workshop home
        if: ${{ !cancelled() }}
        run: |
          node -e "const fs=require('fs'),p=require('path'),h=require('os').homedir();const found=['Workshop','.workshop'].map(n=>p.join(h,n)).filter(d=>fs.existsSync(d));if(found.length){console.error('Created by a test: '+found.join(', '));process.exit(1)}"
