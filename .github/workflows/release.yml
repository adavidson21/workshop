# Release: creates a release tag and GitHub release.
# Runs on its own when 'checks' passes on a push to main: if the version was bumped, it releases that commit;
# if that version is already released, it does nothing. To release by hand instead:
# Actions > Release > Run workflow. Leave Tag blank: it becomes v<version> from agent/version.mjs at the
# commit you release. Work mode installs and updates only by these tags (Workshop README, Work mode).
name: Release

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to release (default: main)"
        required: false
        default: main
      tag:
        description: "Leave blank to use the version in agent/version.mjs (v<version>). If set, it must match."
        required: false
        default: ""
      notes:
        description: "Release notes (optional)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Automatic runs: only after a green 'checks' run on a push to main (not a PR from a branch named main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
      - name: Pick the tag
        id: tag
        env:
          GIVEN: ${{ inputs.tag }}
        run: |
          version=$(sed -n "s/^export const VERSION = '\\([^']*\\)';.*/\\1/p" agent/version.mjs)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not read a version like 1.2.3 from agent/version.mjs (got '$version')."
            exit 1
          fi
          tag="v$version"
          if [ -n "$GIVEN" ] && [ "$GIVEN" != "$tag" ]; then
            echo "::error::Tag $GIVEN does not match the version in agent/version.mjs ($tag). Leave Tag blank, or bump the version first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag."
      - name: Check that CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Work mode installs and updates by these tags, so a tag is only made on a commit whose checks passed.
          sha=$(git rev-parse HEAD)
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?head_sha=$sha&status=success&per_page=1" --jq '.total_count')
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::No passing 'checks' run on $sha. Wait for CI to finish green on this commit (or rerun it), then release again."
            exit 1
          fi
          echo "CI passed on $sha."
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ inputs.notes }}
          AUTO: ${{ github.event_name == 'workflow_run' }}
        run: |
          sha=$(git rev-parse HEAD)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            if [ "$AUTO" = "true" ]; then
              echo "$TAG is already released. Nothing to do (bump the version to release)."
              exit 0
            fi
            echo "::error::$TAG is already released. Bump the version in agent/version.mjs, then run this again."
            exit 1
          fi
          # Notes: what was typed, then GitHub's list of merged PRs since the previous release.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$sha" --title "$TAG" \
            --notes "${NOTES:-Release $TAG ($sha).}" --generate-notes --latest
          echo "Released $TAG at $sha."
